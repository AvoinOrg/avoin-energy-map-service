[project]
name = "avoin-energy-map-service"
version = "0.1.0"
description = ""
authors = [
    {name = "ninh-cr",email = "ninh.truong@columbiaroad.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "geoalchemy2 (>=0.18.0,<0.19.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "shapely (>=2.1.1,<3.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]

[tool.poetry]
packages = [{include = "avoin_energy_map_service", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
